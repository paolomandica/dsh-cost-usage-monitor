# dsh bundle patch: inserts this plugin into the profile's layer stack.
#
# The Host half is a no-op (all rendering lives in the browser bundle); the row
# exists so the package resolves as a Loader entry and dsh-client-modules can
# publish ./client as a browser module.
- insert:
    - id: dsh-usage-monitor
      name: 'dsh-usage-monitor'
