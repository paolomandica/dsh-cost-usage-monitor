# dsh bundle patch: inserts this plugin into the profile's layer stack.
#
# The Host half registers the read-only balance route the browser half reads
# (see index.js and AGENTS.md §5); the row also makes the package resolve as a
# Loader entry so dsh-client-modules can publish ./client as a browser module.
- insert:
    - id: dsh-cost-usage-monitor
      name: 'dsh-cost-usage-monitor'
